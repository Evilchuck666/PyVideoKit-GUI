[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyVideoKit-GUI"
version = "0.4.0"
description = "GUI for PyVideoKit — FFmpeg-based video processing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Evilchuck666", email = "carlos.martinez.medina1992@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.0",
    "PyVideoKit-Libs",
]

[project.scripts]
pvk-gui = "pyvideokit_gui._main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pyvideokit_gui"]
